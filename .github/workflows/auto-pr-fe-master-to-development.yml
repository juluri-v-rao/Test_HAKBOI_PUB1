name: Auto PR FE-MASTER to Development

on:
  push:
    branches:
      - FE-MASTER

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update PR into Development
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          existing=$(gh pr list --base Development --head FE-MASTER --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --base Development \
              --head FE-MASTER \
              --title "Sync: FE-MASTER into Development" \
              --body "Automated PR — new commits were pushed to FE-MASTER and need to be promoted into Development."
            echo "PR created."
          else
            echo "Open PR already exists (#$existing) — nothing to do."
          fi
